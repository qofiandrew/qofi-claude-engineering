# swarm.conf — one repo per line:  session_name | /path/to/repo | TOKEN_VAR_NAME | CHANNEL_ID | GUILD_ID | ACCOUNT | ENGINE | CODEX_AUTH_POOL
# session_name: short, no spaces (becomes tmux session "swarm-<name>")
# TOKEN_VAR_NAME: name of the env var in tokens.env holding that repo's bot token
# CHANNEL_ID: Discord channel id this swarm is bound to (used by swarm-watch.sh
#   for heartbeats and directly bound by the Codex bridge runtime).
# GUILD_ID: Discord guild (server) snowflake. Used together with channel by
#   consumers (iOS widget) to build discord://channels/<guild>/<channel>
#   deep-links per the frozen swarm-status/v1 contract. Optional during
#   transition (blank emits null and consumers degrade gracefully) but
#   strongly recommended — the widget's tap-to-jump only works when set.
# ACCOUNT (optional, 6th field): multi-account partition label. BLANK = the
#   default account = today's behavior (keychain auth at ~/.claude) — leave it
#   empty and nothing changes. A <label> pins this swarm to an isolated config
#   dir ~/.claude-accounts/<label> + a vault token OAUTH_TOKEN_<LABEL_UPPER>.
#   Resolved by swarm_account_resolve (swarm-lib.sh). Provisioning accounts +
#   tokens is a terms-cleared operator step; the mechanism is inert until then.
# ENGINE (optional, 7th field): blank/claude preserves the historical Claude
#   runtime; codex selects the independently gated Codex Discord bridge.
# CODEX_AUTH_POOL (optional, 8th field): named ordered Codex profile pool from
#   codex-profiles.json. Blank means `default`. This is deliberately distinct
#   from the Claude-only ACCOUNT field.
#
# Keep this list short to start — one or two repos. A single Max pool won't feed
# more than ~1–2 teams running concurrently.

