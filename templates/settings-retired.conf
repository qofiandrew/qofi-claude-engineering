# settings-retired.conf — permission rules doctrine has explicitly RETIRED.
#
# The settings merge (settings_merge_swarm in bin/swarm-lib.sh) is additive-
# only by design ("never clobber"): template rules union into each repo's
# .claude/settings.json, foreign entries are preserved. That means a rule
# doctrine later walks back would persist in every stamped repo forever —
# agents cannot remove it themselves (editing settings.json is a permission-
# gate hard floor). This file is the ONE subtractive channel: exact-match
# rules listed here are REMOVED from permissions.allow AND permissions.deny
# during every sync/init/onboard settings merge.
#
# Rules: one rule per line, exact string match against the settings entry.
# '#' starts a comment. Removal is doctrine-reviewed — a rule lands here only
# with the replacement policy already stamped (never remove a floor without
# its successor in the same sync).
#
# Retired 2026-07-08 — blanket force-push denies, replaced by the per-target
# split (deny force to main/dev; auto-approve force to the agent's own
# worktree-* branch; permission-gate hook classifies everything else). See
# ADR-0012 and templates/engineering-cto/settings.example.json.
Bash(git push *--force*)
Bash(git push *--force-with-lease*)
Bash(git push *-f *)
