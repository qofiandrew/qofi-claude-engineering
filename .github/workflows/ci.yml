name: verify

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # The product targets macOS and promises bash-3.2-compatible host scripts.
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.1
      - name: Stage owner-controlled CI toolchain
        run: |
          ci_toolchain="$HOME/.nvm/versions/node/v22.23.1"
          setup_node_root="$(dirname "$(dirname "$(realpath "$(command -v node)")")")"
          mkdir -p "$ci_toolchain"
          cp -R "$setup_node_root/." "$ci_toolchain"
          chmod -R go-w "$HOME/.nvm"
          echo "$ci_toolchain/bin" >> "$GITHUB_PATH"
          "$ci_toolchain/bin/node" --version | grep -qx 'v22.23.1'
          "$ci_toolchain/bin/npm" --version >/dev/null
          "$ci_toolchain/bin/npx" --version >/dev/null
      - name: Install pinned Bun runtime
        run: |
          ci_toolchain="$HOME/.nvm/versions/node/v22.23.1"
          npm install --global --prefix "$ci_toolchain" bun@1.3.14
          chmod -R go-w "$ci_toolchain"
          "$ci_toolchain/bin/bun" --version | grep -qx '1.3.14'
      - name: Install audited Codex sandbox runtime
        run: |
          ci_toolchain="$HOME/.nvm/versions/node/v22.23.1"
          npm install --global --prefix "$ci_toolchain" @openai/codex@0.144.1
          chmod -R go-w "$ci_toolchain"
          codex --version | grep -qx 'codex-cli 0.144.1'
      - name: Verify CI toolchain trust fixture
        run: |
          bun -e 'import { resolveToolchainPlan } from "./codex-bridge/toolchain.ts"; const prefix = `${process.env.HOME}/.nvm/versions/node/v22.23.1/`; const plan = resolveToolchainPlan(process.cwd()); for (const name of ["node", "npm", "npx", "bun"]) { if (!plan.executables[name]?.startsWith(prefix)) throw new Error(`CI tool escaped owner-controlled prefix: ${name}`) }'
      - name: Install locked bridge dependencies
        run: |
          (cd bridge && bun install --frozen-lockfile --no-summary)
          (cd codex-bridge && bun install --frozen-lockfile --no-summary)
      - name: Run canonical repository suite
        env:
          QOFI_REQUIRE_CODEX_SANDBOX: "1"
        run: npm test
      - name: Audit production dependency graphs
        run: npm run audit:production
